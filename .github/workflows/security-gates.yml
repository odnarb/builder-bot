name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Install Stripe API dependencies
        run: npm --prefix apps/functions/stripe-api ci

      - name: Install Web UI dependencies
        run: npm --prefix apps/webui ci

      - name: Run security checks
        run: npm run check:security
